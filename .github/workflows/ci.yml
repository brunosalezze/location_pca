# Builds and runs the tests on every push and pull request. The unit tests use
# a brute-force stand-in for the MIP solver, and when Gurobi is not installed
# the Makefile builds the program with it too (NO_GUROBI is detected), so
# neither Gurobi nor a license is needed here. The planar-algorithm tests run
# as part of 'make test'. The Gurobi-certified comparison (`make check`) must
# be run locally.
name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc-13, gcc-14, clang-18]
    steps:
      - uses: actions/checkout@v4
      - name: Compiler version
        run: ${{ matrix.compiler }} --version
      - name: Unit tests (with AddressSanitizer and UBSan, warnings as errors)
        run: make test CC=${{ matrix.compiler }} CFLAGS=-Werror
